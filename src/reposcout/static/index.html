<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RepoScout</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236699FF'/%3E%3Cstop offset='.55' stop-color='%230D59F2'/%3E%3Cstop offset='1' stop-color='%23610BDA'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='14' cy='14' r='6.5' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M19 19l6 6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="{{static}}/js/theme-init.js"></script>
<link rel="stylesheet" href="{{static}}/ui.css">
<script type="module" src="{{static}}/js/local.js"></script>
</head>
<body>
<header class="nav"><div class="wrap">
  <span class="logo"><span class="m"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></svg></span><span class="t">RepoScout</span></span>
  <div class="tabs" role="tablist" aria-label="Tools">
    <button class="navlink" type="button" role="tab" id="tab-ask" aria-controls="ask" aria-selected="true" data-tab="ask">Ask</button>
    <button class="navlink" type="button" role="tab" id="tab-review" aria-controls="review" aria-selected="false" tabindex="-1" data-tab="review">Review a diff</button>
    <button class="navlink" type="button" role="tab" id="tab-find" aria-controls="find" aria-selected="false" tabindex="-1" data-tab="find">Find code</button>
  </div>
  <div class="right">
    <button class="btn quiet icon" type="button" id="themeBtn" aria-label="Switch theme"></button>
  </div>
</div></header>

<main class="wrap local" id="main" tabindex="-1">
  <div class="repobar" id="stats" aria-live="polite">
    <span class="av" aria-hidden="true">RS</span>
    <span class="nm">Loading index…</span>
    <span class="meta"><span class="skel w-60"></span></span>
  </div>

  <section id="ask" role="tabpanel" aria-labelledby="tab-ask">
    <form class="input box" id="ask-form">
      <textarea id="question" rows="3" aria-label="Your question" placeholder="Ask about the codebase, e.g. “How are webhook signatures verified?”"></textarea>
    </form>
    <div class="actrow"><button class="btn primary" type="submit" form="ask-form">Ask</button><span class="keys"><kbd>Ctrl/⌘</kbd> + <kbd>Enter</kbd></span></div>
    <div class="out" id="ask-out" aria-live="polite"></div>
  </section>

  <section id="review" role="tabpanel" aria-labelledby="tab-review" hidden>
    <form class="input box" id="review-form">
      <textarea class="mono" id="diff" rows="8" aria-label="Unified diff" placeholder="Paste a unified diff (output of git diff)…"></textarea>
    </form>
    <div class="actrow">
      <button class="btn primary" type="submit" form="review-form">Review</button>
      <label class="minsev" for="min-sev">Minimum severity
        <span class="input"><select id="min-sev"><option value="nit">Nit</option><option value="minor">Minor</option><option value="major">Major</option><option value="critical">Critical</option></select></span>
      </label>
      <span class="keys"><kbd>Ctrl/⌘</kbd> + <kbd>Enter</kbd></span>
    </div>
    <div class="out" id="review-out" aria-live="polite"></div>
  </section>

  <section id="find" role="tabpanel" aria-labelledby="tab-find" hidden>
    <form class="input find" id="find-form" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="query" aria-label="Search the code" placeholder="Function names, keywords, or a description" autocomplete="off">
      <button class="btn primary" type="submit">Search</button>
    </form>
    <div class="out" id="find-out" aria-live="polite"></div>
  </section>
</main>
</body>
</html>
