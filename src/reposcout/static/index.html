<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoScout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui.css?v={{asset_version}}">
<style>
  main { max-width: 920px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  #stats { color: var(--text-3); font-size: 13px; }
  nav { display: flex; gap: 4px; margin: 24px 0 16px; border-bottom: 1px solid var(--border); }
  nav button { background: none; border: 0; padding: 10px 14px; font: inherit; color: var(--text-3);
               cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  section { display: none; }
  section.active { display: block; }
  textarea.input { min-height: 96px; }
  #diff { min-height: 240px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  select.input { width: auto; height: 36px; }
  .hint { color: var(--text-3); font-size: 13px; }
  .card { margin-top: 16px; }
  .answer { white-space: pre-wrap; }
  .sources { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; }
  .sources li { padding: 4px 0; border-top: 1px dashed var(--border); font-family: ui-monospace, Menlo, monospace; }
  .sources li.cited::before { content: "● "; color: var(--accent); }
  .finding { border-left: 3px solid var(--nit); padding: 8px 12px; margin: 12px 0; background: var(--surface-2); border-radius: 0 8px 8px 0; }
  .finding.critical { border-color: var(--critical); } .finding.major { border-color: var(--major); }
  .finding.minor { border-color: var(--minor); }
  .finding .meta { font-size: 12px; color: var(--text-3); font-family: ui-monospace, Menlo, monospace; }
  .finding .title { font-weight: 600; margin: 2px 0; }
  pre { background: var(--surface-2); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 13px; margin: 8px 0 0; }
  .finding pre { background: var(--surface); }
  .banner { margin-top: 16px; }
  .result-hit { margin-top: 14px; }
  .result-hit .meta { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--text-3); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Repo<span>Scout</span></h1>
    <div id="stats">loading index…</div>
  </header>

  <nav>
    <button class="active" data-tab="ask">Ask</button>
    <button data-tab="review">Review a diff</button>
    <button data-tab="search">Search</button>
  </nav>

  <section id="ask" class="active">
    <textarea class="input mono" id="question" placeholder="Ask about the codebase, e.g. “How are webhook signatures verified?”"></textarea>
    <div class="row"><button class="btn primary" id="ask-btn">Ask</button><span class="hint"><kbd class="kbd">Ctrl/⌘</kbd> + <kbd class="kbd">Enter</kbd></span></div>
    <div id="ask-out"></div>
  </section>

  <section id="review">
    <textarea class="input mono" id="diff" placeholder="Paste a unified diff (output of git diff)…"></textarea>
    <div class="row">
      <button class="btn primary" id="review-btn">Review</button>
      <label class="hint">Minimum severity
        <select class="input" id="min-sev"><option>nit</option><option>minor</option><option>major</option><option>critical</option></select>
      </label>
    </div>
    <div id="review-out"></div>
  </section>

  <section id="search">
    <textarea class="input mono" id="query" placeholder="Keywords or a description of the code you are looking for"></textarea>
    <div class="row"><button class="btn primary" id="search-btn">Search</button></div>
    <div id="search-out"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
async function post(url, body) {
  const resp = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || (data.detail && JSON.stringify(data.detail)) || resp.statusText);
  return data;
}
function showError(target, err) { target.replaceChildren(el("div", "banner error", err.message)); }
async function withButton(btn, fn) {
  if (btn.getAttribute("aria-busy") === "true") return;
  btn.setAttribute("aria-busy", "true");
  try { await fn(); } finally { btn.removeAttribute("aria-busy"); }
}

document.querySelectorAll("nav button").forEach((btn) => btn.addEventListener("click", () => {
  document.querySelectorAll("nav button, section").forEach((n) => n.classList.remove("active"));
  btn.classList.add("active"); $(btn.dataset.tab).classList.add("active");
}));

fetch("/stats").then((r) => r.json()).then((s) => {
  const i = s.index || {};
  $("stats").textContent = `${i.files || 0} files · ${i.chunks || 0} chunks · ${s.llm || "no LLM"}`;
}).catch(() => { $("stats").textContent = "stats unavailable"; });

$("ask-btn").addEventListener("click", () => withButton($("ask-btn"), async () => {
  const out = $("ask-out");
  try {
    const data = await post("/ask", { question: $("question").value });
    const card = el("div", "card");
    card.append(el("div", "answer", data.answer));
    if (data.sources.length) {
      const list = el("ul", "sources");
      data.sources.forEach((s) => {
        const li = el("li", data.cited.includes(s.ref) ? "cited" : "",
          `[${s.ref}] ${s.path}:${s.start_line}-${s.end_line}${s.name ? "  " + s.name : ""}`);
        list.append(li);
      });
      card.append(list);
    }
    card.append(el("div", "hint", `${data.latency_ms} ms`));
    out.replaceChildren(card);
  } catch (err) { showError(out, err); }
}));

$("review-btn").addEventListener("click", () => withButton($("review-btn"), async () => {
  const out = $("review-out");
  try {
    const data = await post("/review", { diff: $("diff").value, min_severity: $("min-sev").value });
    const card = el("div", "card");
    card.append(el("div", "", data.headline));
    Object.entries(data.file_summaries || {}).forEach(([path, summary]) =>
      card.append(el("div", "hint", `${path}: ${summary}`)));
    data.findings.forEach((f) => {
      const box = el("div", `finding ${f.severity}`);
      box.append(el("div", "meta", `${f.severity} · ${f.category} · ${f.path}:${f.line} · ${f.source}`));
      box.append(el("div", "title", f.title));
      box.append(el("div", "", f.message));
      if (f.suggestion) box.append(el("pre", "", f.suggestion));
      card.append(box);
    });
    card.append(el("div", "hint", `${data.stats.latency_ms} ms · ${data.stats.llm_calls} LLM call(s)`));
    out.replaceChildren(card);
  } catch (err) { showError(out, err); }
}));

$("search-btn").addEventListener("click", () => withButton($("search-btn"), async () => {
  const out = $("search-out");
  try {
    const data = await post("/search", { query: $("query").value, k: 8 });
    const card = el("div", "card");
    if (!data.results.length) card.append(el("div", "hint", "No matches."));
    data.results.forEach((r) => {
      const hit = el("div", "result-hit");
      hit.append(el("div", "meta", `${r.path}:${r.start_line}-${r.end_line}${r.name ? "  " + r.name : ""}`));
      hit.append(el("pre", "", r.text.split("\n").slice(0, 14).join("\n")));
      card.append(hit);
    });
    out.replaceChildren(card);
  } catch (err) { showError(out, err); }
}));

[["question", "ask-btn"], ["diff", "review-btn"], ["query", "search-btn"]].forEach(([input, btn]) =>
  $(input).addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") $(btn).click(); }));
</script>
</body>
</html>
