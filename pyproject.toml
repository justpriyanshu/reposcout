[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcout"
version = "0.1.0"
description = "Ask questions about a codebase and get AI reviews of pull requests. Runs fully free with local models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["code-review", "rag", "llm", "github", "code-search", "ollama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "pathspec>=0.12",
    "pydantic>=2.6",
    "limits>=4.0",
    # Optional at runtime: the code falls back to NumPy search / regex chunking without them.
    "sqlite-vec>=0.1.6",
    # 0.26.0 crashes (segfault during garbage collection) while walking some JavaScript trees.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack>=1.0",
]

[project.optional-dependencies]
# Postgres + pgvector storage for the public app (REPOSCOUT_DATABASE_URL, e.g. Neon).
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2", "pgvector>=0.3"]
# Bandit security checks in reviews (gitleaks and Semgrep are separate binaries).
scanners = ["bandit>=1.8"]
# Error tracking (SENTRY_DSN) and LLM tracing (LANGFUSE_* keys).
observability = ["sentry-sdk[fastapi]>=2.0", "langfuse>=3.0"]
all = ["reposcout[postgres,scanners,observability]"]
# Kept for `pip install -e ".[dev]"`; uv uses the dev dependency group below.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pyright>=1.1.380", "reposcout[postgres,scanners]"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pyright>=1.1.380"]

[project.scripts]
reposcout = "reposcout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The built web UI (npm --prefix frontend ci && npm --prefix frontend run build); build it before packaging.
reposcout = ["static/dist/*.html", "static/dist/assets/*.js", "static/dist/assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["reposcout"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "pragma: no cover"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]
